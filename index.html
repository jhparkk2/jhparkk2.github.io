<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>나와봄으로 이동 중...</title>
  <link rel="canonical" href="https://jhparkk2.github.io/my-place-map/">
  <meta http-equiv="refresh" content="0; url=https://jhparkk2.github.io/my-place-map/">
  <script>
    (function () {
      var app = "https://jhparkk2.github.io/my-place-map/";
      // 카카오톡에서 잘못된 루트 링크로 들어오더라도 원래 나와봄 주소로 이동합니다.
      var extra = window.location.search + window.location.hash;
      window.location.replace(app + extra);
    })();
  </script>
</head>
<body>
  <p>나와봄 앱으로 이동하고 있어요.</p>
  <p><a href="https://jhparkk2.github.io/my-place-map/">나와봄 바로 열기</a></p>
</body>
</html>
